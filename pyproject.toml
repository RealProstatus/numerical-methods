[build-system]
requires = ["scikit-build-core>=0.9.0", "nanobind>=2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pymagnus-hpc"
version = "0.1.0"
description = "High-Performance C++/MKL/CUDA/MPI Magnus-Chebyshev Solvers for QuTiP 5, Qiskit Dynamics, and SciPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
]

[project.optional-dependencies]
qutip = ["qutip>=5.0.0"]
scipy = ["scipy>=1.10.0"]
qiskit = ["qiskit-dynamics>=0.5.0"]
gpu = ["cupy-cuda12x>=12.0.0"]
mpi = ["mpi4py>=3.1.0"]

[tool.scikit-build]
wheel.packages = ["python/pymagnus_hpc"]
cmake.build-type = "Release"
cmake.args = [
    "-DBUILD_PYTHON_BINDINGS=ON",
]